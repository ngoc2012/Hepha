<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Element Absolute Position</title>
    <style>
        .page {
            border: 1px solid black;
            margin: 20px;
            padding: 20px;
        }
        .element {
            margin: 20px;
            padding: 20px;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div class="page">
        <p class="element">Element 1</p>
        <p class="element">Element 2</p>
        <p class="element">Element 3</p>
    </div>

    <script>
        // Function to get the absolute position of an element
        function getAbsolutePosition(element) {
            const rect = element.getBoundingClientRect();
            const scrollLeft = window.pageXOffset || document.documentElement.scrollLeft;
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

            return {
                top: rect.top + scrollTop,
                left: rect.left + scrollLeft,
                bottom: rect.bottom + scrollTop,
                right: rect.right + scrollLeft
            };
        }

        // Select elements and get their absolute positions
        const elements = document.querySelectorAll('.element');
        elements.forEach(element => {
            const position = getAbsolutePosition(element);
            console.log(`Element: ${element.textContent}, Position:`, position);
        });
    </script>
</body>
</html>
